#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[palette]
  fg = '#cdd6f4'
  muted = '#6c7086'
  bracket = '#94e2d5'
  session = '#94e2d5'
  path = '#cba6f7'
  git = '#fab387'
  venv = '#89b4fa'
  ok = '#a6e3a1'
  err = '#f38ba8'

[transient_prompt]
  template = ' ❯ '
  foreground = 'p:bracket'
  background = 'transparent'
  type = 'text'
  style = 'plain'

[secondary_prompt]
  template = '<p:muted>></> '
  background = 'transparent'
  foreground = 'p:fg'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'session'
    style = 'plain'
    template = '<p:bracket>┌──(</><p:session>{{ .UserName }}</><p:bracket>@</><p:session>{{ .HostName }}</><p:bracket>)</>'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    template = '<p:bracket>-[</><p:path>{{ .Path }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'agnoster'

  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    template = '<p:bracket>-[</><p:git> {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} </><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      fetch_status = true
      fetch_upstream_icon = false
      enable_untracked_cache = true

  [[blocks.segments]]
    type = 'python'
    style = 'plain'
    template = '<p:bracket>-[</><p:venv> {{ .Venv }} </><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      fetch_version = false
      fetch_virtual_env = true

[[blocks]]
  type = 'rprompt'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    template = '{{ .FormattedMs }} '
    foreground = 'p:muted'
    background = 'transparent'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 3000

  [[blocks.segments]]
    type = 'time'
    style = 'plain'
    template = '{{ .CurrentDate | date "15:04" }}'
    foreground = 'p:muted'
    background = 'transparent'

    [blocks.segments.properties]
      cache_duration = 'none'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'status'
    style = 'plain'
    template = '<p:muted>└─</>{{ if .Root }}#{{ else }}❯{{ end }} '
    foreground = 'p:ok'
    foreground_templates = ['{{ if .Root }}p:err{{ end }}', '{{ if gt .Code 0 }}p:err{{ end }}']
    background = 'transparent'

    [blocks.segments.properties]
      cache_duration = 'none'
      always_enabled = true
