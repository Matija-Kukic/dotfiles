# Monet — tmux (manual, self-contained)
# Faithful static replica of catppuccin/tmux v1.0.1 with the Monet palette's
# options: rounded window pills, window flag icons ("icon" mode), connected
# user + directory status modules on a darker status bar.
# Glyph codepoints verified against the installed FiraCode Nerd Font:
# caps U+E0B6/U+E0B4, block U+2588, user U+F007, dir U+F07B, flags
# U+F116B/U+F009E/U+F009B/U+F05AF/U+F05B0/U+F00C0/U+F004C.

# ── Status bar ──
set -g status-style "bg=#1a1f2b,fg=#f2ece6"
set -g status-left ""
set -g status-right "#[fg=#a0d2fa,nobold,nounderscore,noitalics]#[fg=#151922,bg=#a0d2fa] #[fg=#a0d2fa,bg=#353b4e]#[fg=#f2ece6] #(whoami)#[fg=#353b4e]█#[fg=#deb787,nobold,nounderscore,noitalics]#[fg=#151922,bg=#deb787] #[fg=#deb787,bg=#353b4e]#[fg=#f2ece6] #{b:pane_current_path}#[fg=#353b4e]█"

# ── Window pills ( cap, █ joint,  cap) ──
# inactive: grey number block + surface0 name block
set -g window-status-format "#[fg=#6f758c,bg=default]#[fg=#151922,bg=#6f758c]#I#[fg=#6f758c,bg=#202636]█#[fg=#f2ece6,bg=#202636] #W#{?window_activity_flag, 󱅫,}#{?window_bell_flag, 󰂞,}#{?window_silence_flag, 󰂛,}#{?window_active, 󰖯,}#{?window_last_flag, 󰖰,}#{?window_marked_flag, 󰃀,}#{?window_zoomed_flag, 󰁌,} #[fg=#202636,bg=default] "
# current: accent number block + surface1 name block
set -g window-status-current-format "#[fg=#a0d2fa,bg=default]#[fg=#151922,bg=#a0d2fa]#I#[fg=#a0d2fa,bg=#353b4e]█#[fg=#f2ece6,bg=#353b4e] #W#{?window_activity_flag, 󱅫,}#{?window_bell_flag, 󰂞,}#{?window_silence_flag, 󰂛,}#{?window_active, 󰖯,}#{?window_last_flag, 󰖰,}#{?window_marked_flag, 󰃀,}#{?window_zoomed_flag, 󰁌,} #[fg=#353b4e,bg=default] "
set -g window-status-separator ""
set -g window-status-activity-style "bg=#ead49a,fg=#151922"
set -g window-status-bell-style "bg=#ead49a,fg=#151922"

# ── Panes ──
set -g pane-border-style "fg=#6f758c"
set -g pane-active-border-style "#{?pane_in_mode,fg=#a0d2fa,#{?pane_synchronized,fg=#a4dc99,fg=#a0d2fa}}"

# ── Messages / modes / menus / popups ──
set -g message-style "fg=#a0d2fa,bg=#353b4e,align=centre"
set -g message-command-style "fg=#a0d2fa,bg=#353b4e,align=centre"
set -g mode-style "fg=#deb787,bg=#51586b,bold"
set -g clock-mode-colour "#a0d2fa"
set -g menu-selected-style "fg=#353b4e,bg=#ead49a"
set -g popup-style "bg=#1a1f2b,fg=#f2ece6"
set -g popup-border-style "fg=#353b4e"
