#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[palette]
  fg = '#f2ece6'
  muted = '#6f758c'
  bracket = '#82d5e6'
  session = '#a0d2fa'
  path = '#deb787'
  git = '#e6a37c'
  venv = '#ead49a'
  ok = '#64e880'
  err = '#ed8695'
  node = '#a4dc99'
  golang = '#82d5e6'
  rust = '#ed8695'
  docker = '#a0d2fa'
  cmake = '#f1c5c4'

[transient_prompt]
  template = ' ❯ '
  foreground = 'p:bracket'
  background = 'transparent'
  type = 'text'
  style = 'plain'

[secondary_prompt]
  template = '<p:muted>></> '
  background = 'transparent'
  foreground = 'p:fg'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'session'
    style = 'plain'
    template = '<p:bracket>┌──(</><p:session>{{ .UserName }}</><p:bracket>@</><p:session>{{ .HostName }}</><p:bracket>)</>'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    template = '<p:bracket>-[</><p:path>{{ .Path }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'agnoster'

  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    template = '<p:bracket>-[</><p:git>{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}   {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}   {{ .Staging.String }}{{ end }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      fetch_status = true
      fetch_upstream_icon = false
      enable_untracked_cache = true

  [[blocks.segments]]
    type = 'python'
    style = 'plain'
    template = '<p:bracket>-[</><p:venv> {{ .Venv }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      fetch_version = false
      fetch_virtual_env = true

  [[blocks.segments]]
    type = 'node'
    style = 'plain'
    template = '<p:bracket>-[</><p:node> {{ .Full }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      fetch_package_manager = false
      home_enabled = false

  [[blocks.segments]]
    type = 'go'
    style = 'plain'
    template = '<p:bracket>-[</><p:golang> {{ .Full }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      home_enabled = false

  [[blocks.segments]]
    type = 'rust'
    style = 'plain'
    template = '<p:bracket>-[</><p:rust> {{ .Full }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      home_enabled = false

  [[blocks.segments]]
    type = 'cmake'
    style = 'plain'
    template = '<p:bracket>-[</><p:cmake> cmake {{ .Full }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'
      display_mode = 'context'
      home_enabled = false

  [[blocks.segments]]
    type = 'docker'
    style = 'plain'
    template = '<p:bracket>-[</><p:docker> {{ .Context }}</><p:bracket>]</>'

    [blocks.segments.properties]
      cache_duration = 'none'

[[blocks]]
  type = 'rprompt'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    template = '{{ .FormattedMs }} '
    foreground = 'p:muted'
    background = 'transparent'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 3000

  [[blocks.segments]]
    type = 'time'
    style = 'plain'
    template = '{{ .CurrentDate | date "15:04" }}'
    foreground = 'p:muted'
    background = 'transparent'

    [blocks.segments.properties]
      cache_duration = 'none'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'status'
    style = 'plain'
    template = '<p:muted>└─</>{{ if .Root }}#{{ else }}❯{{ end }} '
    foreground = 'p:ok'
    foreground_templates = ['{{ if .Root }}p:err{{ end }}', '{{ if gt .Code 0 }}p:err{{ end }}']
    background = 'transparent'

    [blocks.segments.properties]
      cache_duration = 'none'
      always_enabled = true
