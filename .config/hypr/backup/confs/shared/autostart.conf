# nm-applet retired 2026-08-04: caelestia bar network icon + popout (Nmcli) replaces it
#exec-once = nm-applet &
#exec-once = waybar
# hyprpaper retired 2026-08-06 (R3): caelestia Background renders the wallpaper
# (source: ~/.local/state/caelestia/wallpaper/path.txt, written by switch-theme)
exec-once = env CAELESTIA_WALLPAPERS_DIR=$HOME/dotfiles/wallpapers qs &
exec-once = odmori_oci

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME
